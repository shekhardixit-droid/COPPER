server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── index.html — never cache ──────────────────────────────
    # Browsers must always re-fetch index.html so they pick up
    # the latest hashed JS/CSS bundle filenames after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # ── Hashed static assets — cache forever ─────────────────
    # Vite produces content-hashed filenames (e.g. index-AbCdEf.js)
    # so it is safe to cache them indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── OPTIONS preflight — respond immediately ───────────────
    # Prevents preflight requests hitting the SPA fallback and
    # returning a 200 HTML page instead of a proper CORS response.
    # The actual CORS headers are set by the Express backend;
    # nginx only needs to not block OPTIONS here.
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── SPA fallback — all other routes ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
